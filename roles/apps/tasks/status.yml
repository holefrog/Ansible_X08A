---
# 最终状态检查：验证所有关键部署结果

- name: 检查 FSClock 应用是否已成功安装
  ansible.builtin.command: "{{ adb_cmd }} shell pm list packages systems.sieber.fsclock"
  register: check_fsclock_installed
  changed_when: false
  failed_when: "'systems.sieber.fsclock' not in check_fsclock_installed.stdout"

- name: 检查屏幕保护程序是否配置为 FSClock
  ansible.builtin.command: "{{ adb_cmd }} shell settings get secure screensaver_components"
  register: check_screensaver_components
  changed_when: false
  failed_when: "'systems.sieber.fsclock/.FullscreenDream' not in check_screensaver_components.stdout"

- name: 检查息屏超时时间是否设置为 300000 毫秒
  ansible.builtin.command: "{{ adb_cmd }} shell settings get system screen_off_timeout"
  register: check_screen_timeout
  changed_when: false
  failed_when: "'300000' not in check_screen_timeout.stdout"

- name: 检查默认桌面启动器 (Launcher) 是否生效
  ansible.builtin.command: "{{ adb_cmd }} shell cmd package resolve-activity -c android.intent.category.HOME -a android.intent.action.MAIN"
  register: check_launcher
  changed_when: false
  failed_when: "'bitpit.launcher' not in check_launcher.stdout"

- name: 检查虚拟软键盘 (Virtual Soft Keys) 应用是否已安装
  ansible.builtin.command: "{{ adb_cmd }} shell pm list packages tw.com.daxia.virtualsoftkeys"
  register: check_virtual_key
  changed_when: false
  failed_when: "'tw.com.daxia.virtualsoftkeys' not in check_virtual_key.stdout"

- name: 检查虚拟软键盘 (Virtual Soft Keys) 是否已激活 (无障碍服务已启用)
  ansible.builtin.command: "{{ adb_cmd }} shell settings get secure enabled_accessibility_services"
  register: check_virtual_key_active
  changed_when: false
  failed_when: "'tw.com.daxia.virtualsoftkeys' not in check_virtual_key_active.stdout"

- name: 获取系统当前电源优化白名单
  ansible.builtin.command: "{{ adb_cmd }} shell dumpsys deviceidle whitelist"
  register: check_battery_opt
  changed_when: false

- name: 检查 apps/files/ 目录下所有已安装应用是否均已成功关闭电源优化
  ansible.builtin.assert:
    that:
      - "item.pkg in check_battery_opt.stdout"
    fail_msg: "【失败】应用 {{ item.pkg }} 未被成功加入电源优化白名单！"
  loop: "{{ all_pkg_names | default([]) }}"

- name: 检查垃圾应用是否已被彻底卸载 (Bloatware)
  ansible.builtin.command: "{{ adb_cmd }} shell pm list packages {{ item }}"
  register: check_junk_apps
  changed_when: false
  failed_when: "item in check_junk_apps.stdout"
  loop: "{{ bloatware_apps | default([]) }}"

- name: 检查顽固的系统应用是否已被停用 (Disabled Apps)
  # -e 参数表示仅列出"已启用"的应用。如果已被停用，结果将为空白。
  ansible.builtin.command: "{{ adb_cmd }} shell pm list packages -e {{ item }}"
  register: check_disabled_apps
  changed_when: false
  failed_when: "item in check_disabled_apps.stdout"
  loop: "{{ disabled_apps | default([]) }}"

- name: 打印最终部署成功状态
  ansible.builtin.debug:
    msg: "✅ 所有部署检查均已通过！Launcher、虚拟按键、屏保、电源优化及垃圾应用清理均已按预期生效。"