---
# 统一处理所有安装应用的电源优化和后台运行限制
- name: 查找 files 目录下所有的 APK 文件
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ role_path }}/files"
    use_regex: true
    patterns:
      - '(?i)^.*\.apk$'
  register: all_apks

- name: 检查控制节点是否已安装 aapt
  delegate_to: localhost
  ansible.builtin.command: which aapt
  register: aapt_check
  changed_when: false
  failed_when: false

- name: 自动在控制节点安装 aapt 工具 (需要 sudo 权限)
  delegate_to: localhost
  become: true
  ansible.builtin.apt:
    name: aapt
    state: present
    update_cache: yes
  when: aapt_check.rc != 0

- name: 提取所有应用的包名 (需控制节点安装 aapt 工具)
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - aapt
      - dump
      - badging
      - "{{ item.path }}"
  loop: "{{ all_apks.files }}"
  register: all_apk_badging
  changed_when: false
  failed_when: false

- name: 从 badging 输出中提取包名
  ansible.builtin.set_fact:
    all_pkg_names: "{{ (all_apk_badging.results | default([])) | selectattr('stdout', 'defined') | map(attribute='stdout') | map('regex_findall', \"package: name='([^']+)'\") | flatten | unique | list }}"

- name: 关闭所有应用的电源优化并解除后台运行限制
  delegate_to: localhost
  ansible.builtin.shell: |
    {{ adb_cmd }} shell dumpsys deviceidle whitelist +{{ item }}
    {{ adb_cmd }} shell cmd appops set {{ item }} RUN_IN_BACKGROUND allow
    {{ adb_cmd }} shell cmd appops set {{ item }} RUN_ANY_IN_BACKGROUND allow
  loop: "{{ all_pkg_names }}"
  changed_when: false
  failed_when: false
  when: all_pkg_names | length > 0
