---
# 禁用 MiVpmService 服务：由于未静音麦克风时该服务会导致 CPU 占用过高，通过取消执行权限将其彻底禁用
- name: 禁用 MiVpmService 以防止 CPU 占用过高
  ansible.builtin.command: "{{ adb_cmd }} shell {{ item }}"
  loop:
    - "su 0 mount -o rw,remount /"
    - chmod 000 /system/bin/MiVpmService
  ignore_errors: yes



- name: 记录清理前的系统空间
  ansible.builtin.command: "{{ adb_cmd }} shell df -h /system /data"
  register: space_before
  changed_when: false

# 卸载并强删预装应用 (Bloatware) 的底层文件，为 /system 分区腾出空间供后续 push 自己的 apk 使用
- name: 批量卸载预装应用并强删底层文件释放 /system 空间
  ansible.builtin.shell: |
    # 1. 获取应用路径 (必须在卸载前获取)
    APK_PATHS=$({{ adb_cmd }} shell pm path {{ item }} | sed -n 's/^package://p' | tr -d '\r')
    
    # 2. 卸载应用 (清理 /data 分区生成的缓存和数据)
    {{ adb_cmd }} shell pm uninstall --user 0 {{ item }}
    
    # 3. 极其谨慎地删除底层系统文件 (防变砖安全校验)
    echo "$APK_PATHS" | while read -r APK_PATH; do
      [ -z "$APK_PATH" ] && continue
      
      # 规范化路径，清理连续斜杠，防止类似 /system/app/ 这种极端路径绕过后续校验
      APK_PATH=$(echo "$APK_PATH" | tr -s '/')
      DIR_PATH=$(dirname "$APK_PATH")
      
      # 使用白名单严格限制可删除的目录范围，绝不允许误删系统关键目录
      case "$DIR_PATH" in
        /system/app|/system/priv-app|/vendor/app|/vendor/priv-app|/product/app|/product/priv-app|/oem/app)
          {{ adb_cmd }} shell "su 0 rm -f '$APK_PATH'"
          ;;
        /system/app/*|/system/priv-app/*|/vendor/app/*|/vendor/priv-app/*|/product/app/*|/product/priv-app/*|/oem/app/*)
          # 额外验证：目录深度必须大于 2 层（即不能是像 /system/app/ 这样的根目录）
          DEPTH=$(echo "$DIR_PATH" | tr -cd '/' | wc -c)
          [ "$DEPTH" -lt 3 ] && echo "Safety ABORT: suspicious shallow path: $DIR_PATH" && continue
          {{ adb_cmd }} shell "su 0 rm -rf '$DIR_PATH'"
          ;;
        *)
          echo "Safety warning: Skipping deletion for unlisted or critical path: $DIR_PATH"
          ;;
      esac
    done
  loop: "{{ bloatware_apps | default([]) }}"
  register: uninstall_result
  changed_when: false
  failed_when: false

- name: 记录清理后的系统空间
  ansible.builtin.command: "{{ adb_cmd }} shell df -h /system /data"
  register: space_after
  changed_when: false

- name: 显示系统空间变化
  ansible.builtin.debug:
    msg:
      - "=== 清理前空间 ==="
      - "{{ space_before.stdout_lines }}"
      - "=== 清理后空间 ==="
      - "{{ space_after.stdout_lines }}"


- name: 通过 ADB 禁用顽固的系统应用
  ansible.builtin.command: "{{ adb_cmd }} shell pm disable-user --user 0 {{ item }}"
  loop: "{{ disabled_apps | default([]) }}"
  register: disable_results
  # pm disable-user 执行成功时，stdout 通常会包含 "Package <包名> new state: disabled-user"
  changed_when: "'disabled-user' in disable_results.stdout"
  # 防止因为某个应用已经被完全卸载或不存在而导致整个 Ansible 任务中断
  failed_when: false
