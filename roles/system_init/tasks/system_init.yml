---
# 尝试主动连接设备，防止由于网络超时或刚开机导致的 device offline
- name: 主动连接 ADB 设备
  ansible.builtin.shell: |
    ADB_BIN=$(echo "{{ adb_cmd }}" | awk '{print $1}')
    IP=$(echo "{{ adb_cmd }}" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]+)?')
    if [ -n "$IP" ]; then
      $ADB_BIN connect $IP
    fi
  changed_when: false
  ignore_errors: yes

- name: 检查 ADB 设备在线状态
  ansible.builtin.command: "{{ adb_cmd }} get-state"
  register: adb_state
  changed_when: false
  ignore_errors: yes

- name: 验证设备是否在线（离线时中断并显示明确错误）
  ansible.builtin.fail:
    msg: |
      【连接失败】无法与安卓设备建立通信，设备处于离线 (offline) 或未授权状态。
      请排查以下原因：
      1. 屏幕上是否弹出“允许 USB/网络 调试”的对话框？（若是首次连接，请勾选“一律允许”并同意）
      2. 设备是否进入了深度休眠导致 Wi-Fi 断网？（尝试点亮一下设备屏幕）
      3. 设备的 IP 地址是否发生了变化？（请在设备网络设置中确认是否仍为 {{ adb_cmd | regex_search('[0-9]{1,3}(\.[0-9]{1,3}){3}') }}）
  when: adb_state.rc != 0 or 'device' not in adb_state.stdout

# 确保 ADB 以 root 权限运行，以便执行底层系统配置
- name: 确保 ADB 以 root 权限运行
  ansible.builtin.command: "{{ adb_cmd }} root"
  register: adb_root
  changed_when: "'restarting adbd as root' in adb_root.stdout"

# 禁用 dm-verity 系统验证。这对于修改 /system 分区极其重要，否则修改后重启可能导致设备变砖
- name: 禁用 dm-verity (防止修改系统分区后启动失败)
  ansible.builtin.command: "{{ adb_cmd }} disable-verity"
  register: verity_result
  changed_when: "'reboot' in verity_result.stdout.lower() and 'already disabled' not in verity_result.stdout.lower()"
  failed_when: false

# 如果上一步提示需要重启，则自动执行重启并等待设备重新上线
- name: 自动处理 disable-verity 后的重启需求
  when: verity_result.changed
  block:
    - name: 重启设备以使 disable-verity 生效
      ansible.builtin.command: "{{ adb_cmd }} reboot"

    - name: 等待设备断开连接 (避免设备还没断网就开始轮询)
      ansible.builtin.pause:
        seconds: 15

    - name: 轮询等待设备重新上线并重新获取 Root 权限
      ansible.builtin.shell: |
        ADB_BIN=$(echo "{{ adb_cmd }}" | awk '{print $1}')
        IP=$(echo "{{ adb_cmd }}" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]+)?')
        if [ -n "$IP" ]; then
          $ADB_BIN connect $IP >/dev/null 2>&1
        fi
        {{ adb_cmd }} root
      register: reboot_ready
      until: reboot_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

# 将系统分区重新挂载为读写模式，从而允许修改 /system 目录下的文件
- name: 将系统分区重新挂载为读/写模式
  ansible.builtin.command: "{{ adb_cmd }} remount"
  register: remount_result
  changed_when: "'remount succeeded' in remount_result.stdout"


# 开启自动时间/时区同步，并将系统时区强制设置为温哥华 (America/Vancouver)
- name: 设置时区为 America/Vancouver
  ansible.builtin.command: "{{ adb_cmd }} shell {{ item }}"
  loop:
    - settings put global auto_time 1
    - settings put global auto_time_zone 1
    - setprop persist.sys.timezone America/Vancouver

# ---------------------------------------------------------
# 提前提取需要安装的第三方应用包名，供后续各个 role 复用
# ---------------------------------------------------------
- name: 查找 apps 目录下所有的 APK 文件 (用于组装全量列表)
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/roles/apps/files"
    use_regex: true
    patterns:
      - '(?i)^.*\.apk$'
  register: _apk_files

- name: 检查控制节点是否已安装 aapt
  delegate_to: localhost
  ansible.builtin.command: which aapt
  register: aapt_check
  changed_when: false
  failed_when: false

- name: 自动在控制节点安装 aapt 工具 (需要 sudo 权限)
  delegate_to: localhost
  become: true
  ansible.builtin.apt:
    name: aapt
    state: present
    update_cache: yes
  when: aapt_check.rc != 0

- name: 提取所有应用的包名 (需控制节点安装 aapt 工具)
  delegate_to: localhost
  ansible.builtin.command: "aapt dump badging '{{ item.path }}'"
  loop: "{{ _apk_files.files | default([]) }}"
  register: all_apk_badging
  changed_when: false

- name: 整合 APK 路径与包名为统一变量 all_pkg_names
  ansible.builtin.set_fact:
    # 如果找不到 apk，则返回空列表；否则解析生成的 YAML 文本为 Ansible 字典列表
    all_pkg_names: "{{ (_yaml_list | from_yaml) if (_yaml_list | trim != '') else [] }}"
  vars:
    _yaml_list: |
      {% for res in (all_apk_badging.results | default([])) %}
      {% if res.stdout is defined %}
      - path: "{{ res.item.path }}"
        pkg: "{{ (res.stdout | regex_findall(\"package: name='([^']+)'\")) | first }}"
      {% endif %}
      {% endfor %}